<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Alpstack Technologies</title>
  <desc id="desc">Alpstack builds and operates software products and provides engineering services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1220"/>
      <stop offset=".55" stop-color="#0D1925"/>
      <stop offset="1" stop-color="#082A35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1070 500) rotate(-140) scale(510 390)">
      <stop stop-color="#38BCDA" stop-opacity=".23"/>
      <stop offset="1" stop-color="#38BCDA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFF" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BCDA"/>
      <stop offset="1" stop-color="#7CE7F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
    </style>
  </defs>

  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="30" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="558" rx="29" fill="none" stroke="#FFF" stroke-opacity=".13" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="512" rx="19" fill="url(#grid)" stroke="#FFF" stroke-opacity=".07"/>

  <g class="mono" font-size="13" letter-spacing="1.6">
    <circle cx="55" cy="52" r="5" fill="#7CE7F5"/>
    <text x="70" y="57" fill="#B9C8D3">ALPSTACK / SYSTEMS ONLINE</text>
    <text x="1145" y="57" text-anchor="end" fill="#718493">COIMBATORE · INDIA</text>
  </g>
  <line x1="48" y1="78" x2="1152" y2="78" stroke="#FFF" stroke-opacity=".1"/>

  <image
    x="64"
    y="121"
    width="432"
    height="135"
    preserveAspectRatio="xMinYMid meet"
    href="data:image/png;base64,"
  />

  <g class="sans">
    <text x="64" y="290" fill="#D8E2E9" font-size="28">We build products.</text>
    <text x="64" y="330" fill="#F4F7FA" font-size="28" font-weight="700">We help teams build theirs.</text>
    <rect x="64" y="356" width="435" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="399" fill="#8295A3" font-size="15">Software products · engineering services · long-term operation</text>
  </g>

  <g transform="translate(690 113)" filter="url(#shadow)">
    <rect width="430" height="293" rx="18" fill="#09111A" fill-opacity=".84" stroke="#FFF" stroke-opacity=".12"/>
    <g class="mono">
      <text x="24" y="37" fill="#718493" font-size="12" letter-spacing="1.4">HOW WE WORK / 01</text>
      <circle cx="380" cy="31" r="4" fill="#38BCDA"/>
      <circle cx="397" cy="31" r="4" fill="#7CE7F5"/>
      <line x1="24" y1="57" x2="406" y2="57" stroke="#FFF" stroke-opacity=".09"/>
      <path d="M91 114H177M255 114H341M341 114V215H255M177 215H91M91 215V114" fill="none" stroke="#4B6272" stroke-width="1.5" stroke-dasharray="4 6"/>
      <path d="m157 109 10 5-10 5m164-10 10 5-10 5m-66 96-10 5 10 5M86 193l5 10 5-10" fill="none" stroke="#718493" stroke-width="1.5"/>
      <g transform="translate(48 87)"><rect width="86" height="54" rx="10" fill="#12222F" stroke="#38BCDA" stroke-opacity=".75"/><text x="43" y="33" fill="#7CE7F5" text-anchor="middle" font-size="12" font-weight="700">PLAN</text></g>
      <g transform="translate(177 87)"><rect width="86" height="54" rx="10" fill="#12222F" stroke="#8EA7FF" stroke-opacity=".65"/><text x="43" y="33" fill="#B1C1FF" text-anchor="middle" font-size="12" font-weight="700">BUILD</text></g>
      <g transform="translate(306 87)"><rect width="86" height="54" rx="10" fill="#12222F" stroke="#71E9B9" stroke-opacity=".65"/><text x="43" y="33" fill="#91F7CE" text-anchor="middle" font-size="12" font-weight="700">SHIP</text></g>
      <g transform="translate(177 188)"><rect width="86" height="54" rx="10" fill="#12222F" stroke="#F2C14E" stroke-opacity=".6"/><text x="43" y="33" fill="#F9D979" text-anchor="middle" font-size="12" font-weight="700">IMPROVE</text></g>
      <g transform="translate(48 188)"><rect width="86" height="54" rx="10" fill="#12222F" stroke="#D585F2" stroke-opacity=".6"/><text x="43" y="33" fill="#E2A7F7" text-anchor="middle" font-size="12" font-weight="700">OPERATE</text></g>
      <text x="24" y="272" fill="#718493" font-size="11">THE SAME TEAM STAYS WITH THE SYSTEM</text>
    </g>
  </g>

  <g transform="translate(64 472)" class="mono" font-size="11" letter-spacing="1.2">
    <text fill="#7CE7F5">PRODUCTS BUILT AND OPERATED</text>
    <text x="454" fill="#9AAAB5">SOFTWARE · WEB · CLOUD</text>
    <text x="1070" text-anchor="end" fill="#F2C14E">ALPSTACK.COM ↗</text>
  </g>
</svg>
